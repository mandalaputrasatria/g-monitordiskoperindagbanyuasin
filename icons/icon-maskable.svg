<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10.24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="0" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="215.04" stroke="url(#primaryGrad)" stroke-width="7.68" stroke-dasharray="20.48 10.24" opacity="0.6"/>
  <circle cx="256" cy="256" r="194.56" stroke="url(#goldGrad)" stroke-width="4.096" opacity="0.4"/>

  <!-- Center Hexagon / Shield -->
  <g transform="translate(102.4, 102.4) scale(0.6)">
    <!-- Monitor Base & Screen -->
    <rect x="51.2" y="51.2" width="409.6" height="266.24" rx="30.72" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="12.8" filter="url(#glow)"/>
    
    <!-- Screen Inner -->
    <rect x="71.68" y="71.68" width="368.64" height="225.28" rx="20.48" fill="#0f172a"/>
    
    <!-- Sound Waves / Spreadsheet grid simulation -->
    <line x1="112.64" y1="184.32" x2="112.64" y2="122.88" stroke="#10b981" stroke-width="12.8" stroke-linecap="round"/>
    <line x1="153.6" y1="215.04" x2="153.6" y2="92.16" stroke="#38bdf8" stroke-width="12.8" stroke-linecap="round"/>
    <line x1="194.56" y1="245.76" x2="194.56" y2="143.36" stroke="#6366f1" stroke-width="12.8" stroke-linecap="round"/>
    <line x1="235.52" y1="204.8" x2="235.52" y2="102.4" stroke="#a855f7" stroke-width="12.8" stroke-linecap="round"/>
    
    <!-- Bold 'G' Logo on Right Screen -->
    <path d="M 368.64 122.88 
             A 61.44 61.44 0 1 0 368.64 225.28 
             L 368.64 174.08 
             L 317.44 174.08" 
          fill="none" stroke="url(#goldGrad)" stroke-width="15.36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Monitor Stand -->
    <polygon points="215.04,317.44 296.96,317.44 327.68,399.36 184.32,399.36" fill="#334155"/>
    <rect x="143.36" y="389.12" width="225.28" height="25.6" rx="10.24" fill="url(#primaryGrad)"/>
    
    <!-- Laurel Leaves (Bottom Left & Right) -->
    <path d="M 61.44 399.36 C 92.16 460.8, 184.32 471.04, 256 471.04" fill="none" stroke="url(#goldGrad)" stroke-width="7.68" stroke-linecap="round"/>
    <path d="M 450.56 399.36 C 419.84 460.8, 327.68 471.04, 256 471.04" fill="none" stroke="url(#goldGrad)" stroke-width="7.68" stroke-linecap="round"/>
  </g>

  <!-- Typography Badge -->
  <text x="50%" y="445.44" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="33.28" fill="#ffffff" text-anchor="middle" letter-spacing="2.56">G-MONITOR</text>
  <text x="50%" y="476.16" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="19.456" fill="#eab308" text-anchor="middle" letter-spacing="4.096">DISKOPERINDAG BANYUASIN</text>
</svg>